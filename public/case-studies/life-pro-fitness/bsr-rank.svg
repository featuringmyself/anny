<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 661" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LifePro Fitness Amazon Best Sellers Rank improvement</title>
  <desc id="desc">Line chart showing Best Sellers Rank improving from number 7 to number 2 over three weeks</desc>

  <rect width="1024" height="661" fill="#ffffff"/>

  <text x="512" y="72" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="0.04em" fill="#18181b">
    LIFEPRO FITNESS AMAZON BEST SELLERS RANK IMPROVED
  </text>
  <text x="512" y="108" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="0.04em" fill="#2462ff">
    #7 to #2 IN 3 WEEKS
  </text>

  <rect x="72" y="148" width="880" height="460" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

  <text x="104" y="188" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="500" fill="#71717a">
    | LifePro Fitness Best Sellers Rank over time (lower rank = better)
  </text>

  <circle cx="420" cy="218" r="5" fill="#2462ff"/>
  <text x="432" y="222" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="12" font-weight="500" fill="#52525b">Amazon BSR</text>

  <rect x="140" y="240" width="760" height="320" fill="#fafafa" rx="4"/>

  <line x1="140" y1="320" x2="900" y2="320" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="140" y1="400" x2="900" y2="400" stroke="#e4e4e7" stroke-width="1"/>
  <line x1="140" y1="480" x2="900" y2="480" stroke="#e4e4e7" stroke-width="1"/>

  <text x="120" y="254" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="12" fill="#a1a1aa">#1</text>
  <text x="120" y="324" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="12" fill="#a1a1aa">#3</text>
  <text x="120" y="404" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="12" fill="#a1a1aa">#5</text>
  <text x="120" y="484" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="12" fill="#a1a1aa">#7</text>

  <polyline
    points="200,484 400,404 600,324 800,294"
    fill="none"
    stroke="#2462ff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <polygon
    points="200,484 400,404 600,324 800,294 800,560 200,560"
    fill="#2462ff"
    fill-opacity="0.06"
  />

  <circle cx="200" cy="484" r="6" fill="#ffffff" stroke="#2462ff" stroke-width="2.5"/>
  <circle cx="400" cy="404" r="6" fill="#ffffff" stroke="#2462ff" stroke-width="2.5"/>
  <circle cx="600" cy="324" r="6" fill="#ffffff" stroke="#2462ff" stroke-width="2.5"/>
  <circle cx="800" cy="294" r="6" fill="#ffffff" stroke="#2462ff" stroke-width="2.5"/>

  <text x="200" y="508" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#2462ff">#7</text>
  <text x="400" y="428" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#2462ff">#5</text>
  <text x="600" y="348" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#2462ff">#3</text>
  <text x="800" y="278" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#2462ff">#2</text>

  <text x="200" y="580" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="11" fill="#71717a" transform="rotate(-90 200 580)">Start</text>
  <text x="400" y="580" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="11" fill="#71717a" transform="rotate(-90 400 580)">Week 1</text>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="11" fill="#71717a" transform="rotate(-90 600 580)">Week 2</text>
  <text x="800" y="580" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="11" fill="#71717a" transform="rotate(-90 800 580)">Week 3</text>

  <rect x="720" y="168" width="200" height="36" rx="18" fill="#eff6ff"/>
  <text x="820" y="191" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#2462ff">+5 ranks in 3 weeks</text>
</svg>
